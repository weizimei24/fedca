# FedRotLoRA uses exactly the same zsRE clients and local optimisation as FedIT.
alg: fedrotlora
suffix: zsre8_stage1/fedrotlora
device: 0
dataset: zsre
model: Qwen3-1.7B
task_type: CAUSAL_LM
seed: 42
deterministic: true
cn: 8
sr: 1.0
rnd: 10
test_gap: 1
bs: 1
grad_accum: 8
epoch: 1
step: 63
lr: 0.0001
mode: prototype
lora_rank: 8
lora_alpha: 32
lora_dropout: 0.05
# Existing FedRotLoRA soft-Procrustes hyperparameter; no algorithm change.
lam: 0.5
